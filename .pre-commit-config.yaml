minimum_pre_commit_version: "4.4.0"
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: quality-gate
        name: workspace quality gate
        entry: mise run check
        language: unsupported
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit
      - id: commit-message
        name: conventional commit message
        entry: mise run verify-commit
        language: unsupported
        stages:
          - commit-msg
